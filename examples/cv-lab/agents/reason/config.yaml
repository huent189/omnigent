spec_version: 1
name: reason
description: >-
  Claude Opus at high reasoning effort — the expensive, reserved-for-hard-
  problems worker. Drawing conclusions from data or across papers, finding a
  new research direction, judging a hard tradeoff. Not for routine coding.

executor:
  type: omnigent
  config:
    harness: claude-native
    # Headless workers can't answer ApprovalCards, and managed Claude
    # settings disable `bypassPermissions`. `auto` auto-approves without
    # prompting (-> `--permission-mode auto`). Same setting polly's own
    # claude_code sub-agent uses (examples/polly/agents/claude_code/config.yaml).
    permission_mode: auto
    # No CLI command lists these — ask an agent with `tools.agents` declared
    # (cv-lab's own orchestrator qualifies) to call `sys_list_models`, or
    # check the model picker in the web UI, to confirm the exact current
    # Opus id your subscription/provider resolves — pin it here rather than
    # leaving it unpinned, since this agent's whole reason for existing is
    # "always the strongest model, deliberately".
    model: claude-opus-4-... # REPLACE: exact id from `sys_list_models`
    # Applied via `/effort high` before each turn — confirmed in
    # omnigent/inner/claude_native_executor.py; valid values for Claude:
    # low | medium | high | xhigh | max.
    reasoning_effort: high

prompt: |
  You are the deep-reasoning worker for cv-lab, a computer-vision research
  lab's agent pack. You are dispatched deliberately rarely and deliberately
  expensively — every call here draws on a paid, reserved budget, so earn it.

  You're given tasks like:
  - Synthesize a conclusion from a dataset of results (ablations, benchmark
    runs, experiment logs) that the orchestrator or another worker collected.
  - Read across multiple research papers (summaries or excerpts you're given,
    or that you fetch) and identify a genuinely new research direction, a
    contradiction between them, or a gap the lab's current approach doesn't
    address.
  - Make a hard architectural or methodological call where the tradeoffs are
    genuinely unclear and getting it wrong is costly to redo.

  You do NOT do routine implementation, planning for a well-scoped ticket, or
  anything the sonnet-tier `implement` worker in this pack could do just as
  well for less. If a task handed to you turns out to be simple once you look
  at it, say so plainly instead of padding out an elaborate answer — that
  signal helps the orchestrator route better next time.

  Show your reasoning, not just your conclusion — for a judgment call like
  this, the "why" is usually worth more to the researcher than the verdict
  alone. Flag your own uncertainty explicitly rather than presenting a guess
  as settled.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

# Each dispatched session tracks its own spend, so this cap has to live on
# every Claude-capable worker, not just the orchestrator (see
# examples/cv-lab/config.yaml's guardrails for the full explanation).
# Numbers are a starting point — this worker is the priciest per-call in the
# pack (Opus, high effort) but dispatched rarely, so its per-session ceiling
# is set higher than implement's rather than tighter.
guardrails:
  ask_timeout: 86400
  policies:
    cost_budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 8.00
          ask_thresholds_usd: [4.00]
          expensive_models: ["claude"]
    user_daily_cost_budget:
      type: function
      function:
        path: omnigent.policies.builtins.cost.user_daily_cost_budget
        arguments:
          # Same figures as the orchestrator's — this is one shared
          # cross-session, cross-agent daily cap, not a separate budget per
          # worker; keep the three copies (here, implement, and the
          # orchestrator) in sync if you change it.
          max_cost_usd: 25.00
          ask_thresholds_usd: [10.00, 20.00]
          expensive_models: ["claude"]
