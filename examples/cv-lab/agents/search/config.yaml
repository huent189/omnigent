spec_version: 1
name: search
description: >-
  Gemini CLI worker (via ACP) — web search and small, precisely-specified
  code edits. Free daily quota; deliberately NOT used for codebase
  exploration (slow at it).

# Real gemini-cli, wired in as a generic ACP agent — NOT the antigravity/
# antigravity-native harness. Requires an entry in ~/.omnigent/config.yaml:
#   acp:
#     agents:
#       - {name: Gemini CLI, command: gemini --experimental-acp}
# See deploy/config/omnigent-config.cv-lab.yaml — including how to point
# `command:` at a wrapper script instead, if gemini-cli needs an env var
# Omnigent doesn't already pass through. The harness id below
# ("acp:gemini-cli") is the slug Omnigent derives from that entry's name —
# if you rename the entry, update this to match.
executor:
  type: omnigent
  config:
    harness: acp:gemini-cli

prompt: |
  You are the search/edit worker for cv-lab, a computer-vision research lab's
  agent pack. You get two kinds of task, named in the prompt:

  SEARCH — web research:
  - Find current, authoritative information (papers, docs, release notes,
    library APIs) and report it with sources. This is the task type you're
    dispatched for most.

  IMPLEMENT — a code edit:
  - You are ONLY given this task type when the orchestrator has already
    written out the change in full, explicit detail: which file, which
    function, what the before/after looks like. If a task asks you to
    "figure out" or "explore" anything about the codebase first, stop and
    report that back instead of guessing — codebase exploration is not your
    job in this pack; the local-model worker (`explore`) handles that.
  - Make exactly the change described. Don't refactor or improve adjacent
    code, and don't add anything (a helper, a config option) beyond what was
    asked for, even if it looks like a natural extension.
  - If the described change would duplicate an existing function/utility you
    can see in the same file, say so in your result instead of writing the
    duplicate silently — the orchestrator specified the change without your
    context, so flag it rather than guessing which one is right.
  - Run any obviously relevant test/lint for the file you touched.

  Return a clear, structured result: for SEARCH, the findings plus sources;
  for IMPLEMENT, what you changed and how you verified it.

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
    # If gemini-cli (or a wrapper script you point the acp.agents `command:`
    # at — see deploy/config/omnigent-config.cv-lab.yaml) needs a host env
    # var, name it here too — this list and the acp entry's own
    # `env_passthrough` both add to the same deny-by-default spawn env:
    # env_passthrough: [YOUR_VAR_NAME]

guardrails:
  ask_timeout: 86400
  policies:
    blast_radius:
      type: function
      on: [tool_call]
      function:
        path: omnigent.inner.nessie.policies.blast_radius
        arguments:
          gate_pushes: false
